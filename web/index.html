<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vouch — who really owns this?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 129'><circle cx='64' cy='64' r='30' fill='none' stroke='%23f5f5f5' stroke-width='22' stroke-dasharray='2 12'/></svg>">
<script src="/vendor/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #131316;
    --panel-2: #17171b;
    --line: #26262c;
    --ink: #f2f2f4;
    --dim: #9a9aa4;
    --faint: #6b6b76;
    --ok: #4ade80;
    --none: #60a5fa;
    --refuse: #f0a04b;
    --bad: #f4525f;
    --accent: #c9a2ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: rgba(11,11,12,.92); backdrop-filter: blur(8px); z-index: 5;
  }
  header svg { width: 34px; height: 34px; flex: none; }
  .brand { font-weight: 650; letter-spacing: -.01em; font-size: 17px; }
  .brand small { display: block; font-weight: 400; color: var(--dim); font-size: 12px; letter-spacing: 0; }
  .spacer { flex: 1; }
  .status { font-family: var(--mono); font-size: 11.5px; color: var(--dim); text-align: right; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .dot.on { background: var(--ok); }

  nav { display: flex; gap: 2px; padding: 10px 20px 0; border-bottom: 1px solid var(--line); }
  nav button {
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim);
    font: inherit; font-size: 13px; padding: 8px 14px 10px; cursor: pointer; border-radius: 6px 6px 0 0;
  }
  nav button:hover { color: var(--ink); background: var(--panel); }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  nav button em { font-style: normal; font-family: var(--mono); color: var(--faint); font-size: 11px; margin-right: 6px; }

  main { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.05fr); height: calc(100vh - 119px); }
  #graph { border-right: 1px solid var(--line); position: relative; background: radial-gradient(circle at 50% 40%, #131318 0%, #0b0b0c 70%); }
  #cy { position: absolute; inset: 0; }
  .legend {
    position: absolute; left: 14px; bottom: 14px; font-family: var(--mono); font-size: 11px;
    color: var(--faint); background: rgba(11,11,12,.8); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; line-height: 1.7;
  }
  .legend b { color: var(--dim); font-weight: 500; }

  .side { overflow-y: auto; padding: 18px 20px 60px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); margin: 0 0 10px; font-weight: 600; }
  .tagline { color: var(--dim); margin: 0 0 16px; }
  .tagline b { color: var(--ink); font-weight: 600; }

  .presets { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .presets button {
    text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    font: inherit; font-size: 13px; padding: 9px 12px; border-radius: 9px; cursor: pointer;
  }
  .presets button:hover { border-color: #3a3a44; background: var(--panel-2); }
  .presets button span { display: block; color: var(--faint); font-size: 11.5px; margin-top: 2px; font-family: var(--mono); }

  form { display: flex; gap: 8px; margin-bottom: 18px; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    font: inherit; padding: 10px 12px; border-radius: 9px;
  }
  input[type=text]:focus { outline: 2px solid #3d3358; border-color: #4a3f66; }
  .go { background: var(--accent); color: #160c22; border: 0; font: inherit; font-weight: 650; padding: 10px 16px; border-radius: 9px; cursor: pointer; }
  .go:disabled { opacity: .45; cursor: default; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px;
    padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; margin-bottom: 10px;
  }
  .badge.answered { color: var(--ok); }
  .badge.no_relation { color: var(--none); }
  .badge.refused { color: var(--refuse); }
  .badge.void { color: var(--bad); }
  .answer { font-size: 15px; line-height: 1.6; }
  .answer sup, .cite { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .cite-list { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  .cite-list span {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
  }
  .cite-list span.bad { color: var(--bad); border-color: #4a2226; }

  details { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
  details summary { cursor: pointer; color: var(--dim); font-family: var(--mono); font-size: 11.5px; }
  details pre {
    background: #0d0d10; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    overflow-x: auto; font-family: var(--mono); font-size: 11.5px; color: #cfcfd6; margin: 8px 0 0;
  }
  ul.facts { margin: 8px 0 0; padding-left: 18px; color: #d8d8de; }
  ul.facts li { margin-bottom: 3px; }
  .conflict { color: var(--refuse); }

  .gate { border-color: #3a2f52; background: linear-gradient(180deg, #17131f, #131316); }
  .gate h3 { margin: 0 0 4px; font-size: 14px; }
  .gate .hash { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .gate textarea {
    width: 100%; background: #0d0d10; border: 1px solid var(--line); color: var(--ink);
    font-family: var(--mono); font-size: 11.5px; border-radius: 8px; padding: 9px; margin-top: 8px; resize: vertical;
  }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .row button { font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); }
  .row button.primary { background: var(--ok); color: #04210f; border-color: transparent; font-weight: 650; }
  .row button.danger { background: #24161a; color: var(--bad); border-color: #4a2226; }
  .row button.ghost { background: none; color: var(--dim); }
  .note { font-size: 12.5px; color: var(--dim); margin-top: 8px; }
  .muted { color: var(--faint); }
  .hidden { display: none; }
  .spinner { color: var(--accent); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>

<header>
  <svg viewBox="0 0 128 129" fill="none" aria-hidden="true">
    <g fill="#f2f2f4">
      <circle cx="64" cy="6" r="5"/><circle cx="80" cy="9" r="5"/><circle cx="94" cy="18" r="5"/>
      <circle cx="105" cy="31" r="5"/><circle cx="113" cy="47" r="5"/><circle cx="118" cy="64" r="5"/>
      <circle cx="113" cy="81" r="5"/><circle cx="105" cy="97" r="5"/><circle cx="94" cy="110" r="5"/>
      <circle cx="80" cy="119" r="5"/><circle cx="64" cy="123" r="5"/><circle cx="48" cy="119" r="5"/>
      <circle cx="34" cy="110" r="5"/><circle cx="23" cy="97" r="5"/><circle cx="15" cy="81" r="5"/>
      <circle cx="10" cy="64" r="5"/><circle cx="15" cy="47" r="5"/><circle cx="23" cy="31" r="5"/>
      <circle cx="34" cy="18" r="5"/><circle cx="48" cy="9" r="5"/>
      <circle cx="64" cy="32" r="2.6"/><circle cx="83" cy="40" r="2.6"/><circle cx="91" cy="60" r="2.6"/>
      <circle cx="83" cy="88" r="2.6"/><circle cx="64" cy="97" r="2.6"/><circle cx="45" cy="88" r="2.6"/>
      <circle cx="37" cy="60" r="2.6"/><circle cx="45" cy="40" r="2.6"/>
    </g>
  </svg>
  <div class="brand">Vouch<small>Who really owns this?</small></div>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="dot"></span>connecting…</div>
</header>

<nav id="tabs">
  <button data-track="01" aria-selected="true"><em>01</em>Act on connected data</button>
  <button data-track="02"><em>02</em>Memory and coordination</button>
  <button data-track="03"><em>03</em>Company brain</button>
</nav>

<main>
  <div id="graph">
    <div id="cy"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="side">
    <p class="tagline" id="tagline"></p>
    <h2>Ask</h2>
    <div class="presets" id="presets"></div>
    <form id="ask-form">
      <input type="text" id="q" placeholder="Ask about ownership, impact or evidence…" autocomplete="off">
      <button class="go" type="submit" id="ask-btn">Ask</button>
    </form>
    <div id="out"></div>
  </div>
</main>

<script>
const TENANT = "acme";

const TRACKS = {
  "01": {
    tagline: "<b>Impact that only the graph can see.</b> Depth 1 looks like a join. Depth 4 finds a service nobody would page — and the action it justifies waits for a human.",
    legend: "<b>Service</b> → <b>Service</b> = CALLS, arrow points at the callee<br><b>Team</b> → <b>Service</b> = OWNS<br><b>Person</b> → <b>Change</b> = WROTE",
    show: n => n.label === "Service" || ["CALLS","OWNS","TOUCHED","AFFECTS","RESOLVES","CAUSED"].includes(n.rel),
    presets: [
      ["What breaks if payments-api goes down?", "blast radius, 4 hops"],
      ["Who owns merchant-dashboard?", "declared vs effective owner"],
      ["Does anything depend on internal-status-page?", "the answer that is not a refusal"],
      ["Is anything known about the notification-service?", "the refusal that is not an answer"],
    ],
  },
  "02": {
    tagline: "<b>A claim is invalidated, never deleted.</b> Ask the same question at two dates and get two different truths, each with the document that justified it.",
    legend: "<b>Claim</b> ← <b>Document</b> = SUPPORTS<br><b>Claim</b> ⇄ <b>Claim</b> = CONTRADICTS<br><b>Claim</b> → <b>Episode</b> = LEARNED_IN",
    show: n => ["Claim","Document","Decision","Episode","Service"].includes(n.label)
            || ["SUPPORTS","CONTRADICTS","LEARNED_IN","ABOUT","SUPERSEDES"].includes(n.rel),
    presets: [
      ["What did we believe about payments-api in March 2026?", "as-of query, first date"],
      ["What do we believe about payments-api now?", "same question, later truth"],
      ["Which claim was overturned, and by what?", "contradictions, both sides"],
      ["What was learned from the July payment incident?", "episode memory"],
    ],
  },
  "03": {
    tagline: "<b>Decisions with their grounds.</b> Every decision cites the documents behind it — and a decision whose evidence has been superseded says so instead of sounding settled.",
    legend: "<b>Decision</b> ← <b>Document</b> = SUPPORTS<br><b>Document</b> → <b>Document</b> = SUPERSEDES<br><b>Person</b> → <b>Service</b> = TOUCHED",
    show: () => true,
    presets: [
      ["What backs the decision to move to PSP v4?", "grounded decision"],
      ["What is the evidence for dec-org-restructure?", "the unsupported decision"],
      ["Who has actually been working on payments-api?", "effective ownership"],
      ["What changed since 2026-09-01?", "recent activity"],
      ["Who should be woken for inc-2026-07-11?", "incident routing"],
    ],
  },
};

const COLORS = {
  Service: "#5b8def", Team: "#4ade80", Person: "#f0a04b", Document: "#c9a2ff",
  Decision: "#e879f9", Change: "#94a3b8", Incident: "#f4525f", Claim: "#22d3ee",
  Episode: "#fbbf24", Procedure: "#a3a3a3", Handoff: "#fb923c", Action: "#84cc16",
};

let cy = null, allNodes = [], allEdges = [], track = "01";
let pendingApproval = null;

// ---- graph -----------------------------------------------------------------

function render() {
  const spec = TRACKS[track];
  const nodes = allNodes.filter(n => spec.show({ label: n.label, rel: null }));
  const ids = new Set(nodes.map(n => n.id));
  const edges = allEdges.filter(e => ids.has(e.source) && ids.has(e.target) && spec.show({ label: null, rel: e.rel }));
  const elements = [
    ...nodes.map(n => ({ data: { id: n.id, label: n.key, kind: n.label, title: n.title, crit: n.criticality } })),
    ...edges.map((e, i) => ({ data: { id: "e" + i, source: e.source, target: e.target, rel: e.rel } })),
  ];
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    wheelSensitivity: 0.25,
    style: [
      { selector: "node", style: {
          "background-color": ele => COLORS[ele.data("kind")] || "#888",
          "width": ele => 10 + 3 * (ele.data("crit") || 2),
          "height": ele => 10 + 3 * (ele.data("crit") || 2),
          "label": "data(label)", "font-size": 9, "font-family": "monospace",
          "color": "#e8e8ee", "text-valign": "bottom", "text-margin-y": 4,
          "text-outline-color": "#0b0b0c", "text-outline-width": 3,
          "border-width": 0,
      }},
      { selector: "edge", style: {
          "width": 1, "line-color": "#2e2e38", "target-arrow-color": "#2e2e38",
          "target-arrow-shape": "triangle", "arrow-scale": 0.7, "curve-style": "bezier",
          "opacity": 0.9,
      }},
      { selector: 'edge[rel = "OWNS"]', style: { "line-color": "#2f5c3a", "target-arrow-color": "#2f5c3a", "line-style": "dashed" }},
      { selector: 'edge[rel = "CONTRADICTS"]', style: { "line-color": "#7a2a33", "target-arrow-color": "#7a2a33" }},
      { selector: 'edge[rel = "SUPPORTS"]', style: { "line-color": "#4a3f66", "target-arrow-color": "#4a3f66" }},
      { selector: 'edge[rel = "SUPERSEDES"]', style: { "line-color": "#6b4a2a", "target-arrow-color": "#6b4a2a", "line-style": "dotted" }},
      { selector: "node:selected", style: { "border-width": 3, "border-color": "#c9a2ff" }},
    ],
    layout: { name: "cose", animate: false, nodeRepulsion: 9000, idealEdgeLength: 70, padding: 30 },
  });
  cy.on("tap", "node", ev => {
    const k = ev.target.data("kind"), key = ev.target.data("label");
    if (k === "Service") { document.getElementById("q").value = `Who owns ${key}?`; }
    else if (k === "Decision") { document.getElementById("q").value = `What is the evidence for ${key}?`; }
  });
  document.getElementById("legend").innerHTML = spec.legend;
}

// ---- ask -------------------------------------------------------------------

function renderAnswer(d) {
  const refused = d.refused;
  const cls = refused ? "refused" : (d.outcome === "no_relation" ? "no_relation" : "answered");
  const label = refused ? "REFUSED — no evidence" : d.outcome.replace("_", " ").toUpperCase();
  const cites = (d.citations || []).length
    ? `<div class="cite-list">${d.citations.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : "";
  const viol = (d.violations || []).length
    ? `<div class="cite-list">${d.violations.map(v => `<span class="bad">${esc(v.kind)}: ${esc(v.detail)}</span>`).join("")}</div>` : "";
  const traces = (d.trace || []).map(t => `
    <details>
      <summary>${t.outcome} · ${t.facts.length} fact(s) · ${t.evidence.length} citation(s)</summary>
      ${t.facts.length ? `<ul class="facts">${t.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      ${t.conflicts.map(c => `<div class="conflict">⚠ ${esc(c)}</div>`).join("")}
      ${t.missing_information.map(m => `<div class="muted">missing: ${esc(m)}</div>`).join("")}
      ${t.paths.length ? `<pre>${esc(t.paths.join("\n"))}</pre>` : ""}
      ${t.evidence.length ? `<pre>${esc(t.evidence.join("\n"))}</pre>` : ""}
    </details>`).join("");

  return `<div class="card">
    <div class="badge ${cls}">${label}</div>
    <div class="answer">${esc(d.answer)}</div>
    ${cites}${viol}
    <details><summary>what the agent read (${(d.trace || []).length} tool call(s))</summary>${traces}</details>
  </div>`;
}

async function ask(question) {
  const btn = document.getElementById("ask-btn");
  const out = document.getElementById("out");
  btn.disabled = true;
  out.innerHTML = `<div class="card"><span class="spinner">querying the graph…</span></div>`;
  try {
    const r = await fetch("/api/ask", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ question, tenant: TENANT }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    out.innerHTML = renderAnswer(await r.json());
    if (track === "01") await loadApprovals();
  } catch (e) {
    out.innerHTML = `<div class="card"><div class="badge refused">ERROR</div>${esc(String(e.message || e))}</div>`;
  } finally {
    btn.disabled = false;
  }
}

// ---- the approval gate -----------------------------------------------------

async function loadApprovals() {
  const r = await fetch(`/api/approvals?tenant=${TENANT}`);
  const { approvals } = await r.json();
  const open = approvals.filter(a => a.status === "pending" || a.status === "approved");
  const settled = approvals.filter(a => !["pending", "approved"].includes(a.status));
  const host = document.getElementById("out");
  const box = document.createElement("div");

  if (open.length) {
    const a = open[0];
    pendingApproval = a;
    const payload = JSON.stringify(a.payload, null, 2);
    box.innerHTML = `<div class="card gate">
      <h3>Approval gate · ${esc(a.action)} on ${esc(a.service)}</h3>
      <div class="hash">payload bound to ${esc(a.payload_hash.slice(0, 16))}… · status ${esc(a.status)}</div>
      <div class="note">The action cannot run until a named human approves this exact payload. Edit one character and the approval is void — that is the test.</div>
      <textarea id="payload" rows="9" spellcheck="false">${esc(payload)}</textarea>
      <div class="row">
        ${a.status === "pending" ? `
          <button class="primary" onclick="decide('${a.id}', true)">Approve as ${esc(a.service)} owner</button>
          <button class="danger" onclick="decide('${a.id}', false)">Reject</button>` : ""}
        ${a.status === "approved" ? `
          <button class="primary" onclick="execute('${a.id}', false)">Execute with this payload</button>
          <button class="danger" onclick="execute('${a.id}', true)">Tamper one character, then execute</button>` : ""}
      </div>
      <div class="note" id="gate-note"></div>
    </div>`;
  } else if (settled.length) {
    box.innerHTML = `<div class="card gate"><h3>Approval gate</h3>
      <div class="note">Nothing pending. Last decision: <b>${esc(settled[0].status)}</b> by ${esc(settled[0].decided_by || "—")}.</div></div>`;
  } else {
    box.innerHTML = `<div class="card gate"><h3>Approval gate</h3>
      <div class="note">Nothing filed yet. Ask an impact question, then request the fix — the agent can file it and cannot carry it out.</div>
      <div class="row"><button class="ghost" onclick="requestFix('merchant-dashboard')">File a request for merchant-dashboard</button></div></div>`;
  }
  host.appendChild(box);
}

async function requestFix(service) {
  const r = await fetch("/api/actions", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({
      action: "flag_for_review", service, tenant: TENANT,
      title: `Ownership review: ${service}`,
      body: `The declared owner of ${service} has departed and no replacement has been recorded.`,
      decision: "dec-psp-v4",
    }),
  });
  const d = await r.json();
  const host = document.getElementById("out");
  host.insertAdjacentHTML("afterbegin", renderAnswer(d));
  await loadApprovals();
}

async function decide(id, approve) {
  const r = await fetch(`/api/approvals/${id}/decide`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ approve, decided_by: "ops-lead", note: approve ? "reviewed" : "not now" }),
  });
  const d = await r.json();
  await loadApprovals();
  document.getElementById("gate-note").innerHTML = `<span class="muted">${esc(d.trace.conflicts.join(" ")) || esc(d.trace.facts.join(" "))}</span>`;
}

async function execute(id, tamper) {
  const text = document.getElementById("payload").value;
  let payload;
  try { payload = JSON.parse(text); } catch { payload = {}; }
  if (tamper && payload.title) payload.title = payload.title.slice(0, -1) + (payload.title.endsWith("x") ? "y" : "x");
  const r = await fetch(`/api/approvals/${id}/execute`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ payload }),
  });
  const d = await r.json();
  const note = document.getElementById("gate-note");
  const cls = d.refused ? "refused" : "answered";
  note.innerHTML = `<div class="badge ${cls}" style="margin-top:10px">${esc(d.outcome.toUpperCase())}</div>
    ${d.trace.facts.map(f => `<div>${esc(f)}</div>`).join("")}
    ${d.trace.conflicts.map(c => `<div class="conflict">${esc(c)}</div>`).join("")}
    ${d.trace.missing_information.map(m => `<div class="muted">${esc(m)}</div>`).join("")}`;
}

// ---- chrome ----------------------------------------------------------------

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function setTrack(t) {
  track = t;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.track === t)));
  const spec = TRACKS[t];
  document.getElementById("tagline").innerHTML = spec.tagline;
  document.getElementById("presets").innerHTML = spec.presets
    .map(([q, kind]) => `<button data-q="${esc(q)}">${esc(q)}<span>${esc(kind)}</span></button>`).join("");
  document.querySelectorAll("#presets button").forEach(b => b.onclick = () => { document.getElementById("q").value = b.dataset.q; ask(b.dataset.q); });
  document.getElementById("out").innerHTML = "";
  render();
  if (t === "01") loadApprovals();
}

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setTrack(b.dataset.track));
document.getElementById("ask-form").onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (q) ask(q);
};

(async function boot() {
  const h = await (await fetch("/api/health")).json();
  document.getElementById("status").innerHTML =
    `<span class="dot ${h.healthy ? "on" : ""}"></span>FalkorDB ${esc(h.engine_version)} · ${esc(h.module)} · tenants ${esc(h.tenants.join(", "))}<br>actions via ${esc(h.adapter)}`;
  const g = await (await fetch(`/api/graph?tenant=${TENANT}`)).json();
  allNodes = g.nodes; allEdges = g.edges;
  setTrack("01");
  document.getElementById("q").value = TRACKS["01"].presets[0][0];
})();
</script>
</body>
