<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vouch — who really owns this?</title>
<meta name="description" content="A time-versioned ownership, dependency and decision graph that refuses to answer when it cannot.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 129'><circle cx='64' cy='64' r='42' fill='none' stroke='%23101828' stroke-width='18' stroke-dasharray='1 13' stroke-linecap='round'/></svg>">
<script src="/vendor/cytoscape.min.js"></script>
<style>
/* ============================================================================
   Vouch — design tokens

   One saturated colour, and it is reserved for the action: --signal appears on
   "Ask" and "Approve" -- the two controls that make something happen -- and
   nowhere else. Everything else is ink on paper, which is what leaves the accent
   able to mean anything at all.

   That rule has one consequence worth stating, because it is the product. The
   three answer shapes are NOT colour-coded. They are the same word in the same
   weight in the same place, distinguished only by the shape of a dot: filled for
   an answer, hollow for a positive "nothing connects these", faded for a refusal.
   Three colours would make the refusal look like an error and the empty relation
   look like a warning; two monochrome states that differ by shape say what is
   actually true, which is that these are three different kinds of statement and
   only one of them is a failure to answer.

   The twelve label colours further down are a data encoding for the graph, the
   same way a chart has a categorical scale. The chrome never borrows them.

   One radius (8px). One shadow. An 8px spacing scale. Nothing below 12px, and
   12px is reserved for uppercase eyebrows and monospace code.
   ========================================================================= */
:root {
  --bg: #f5f5f5;          /* Vellum — the page */
  --surface: #ffffff;     /* Paper — cards */
  --surface-2: #f5f5f5;   /* Vellum — inset surfaces, inputs, code */
  --surface-3: #ececec;
  --line: #e5e7eb;        /* Frost — hairlines */
  --line-2: #d4d4d4;      /* Cloud — control borders */

  --ink: #101828;         /* Slate 900 */
  --dim: #4a5565;         /* Slate 600 */
  --faint: #8a8a8a;       /* Iron */

  --accent: #101828;      /* selection and focus are ink, not colour */
  --accent-ink: #ffffff;
  --accent-soft: rgba(16, 24, 40, .08);

  /* The only saturated colour in the system. */
  --signal: linear-gradient(94deg, #ff0201 -33.85%, #ff7802 -1.54%, #ff0201 73.55%);
  --signal-flat: #ff2d02;

  /* Kept for the three answer shapes so no rule breaks if it still asks for one.
     All three are ink; the difference is drawn, not coloured. */
  --yes: #101828;
  --none: #101828;
  --no: #101828;
  --bad: #b42318;         /* the one exception: an engine that is down */

  --r: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
  --sans: Inter, "Söhne", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --t-micro: 12px;
  --t-body: 15px;
  --t-lead: 17px;
  --t-title: 20px;
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 var(--t-body)/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.eyebrow {
  font-size: var(--t-micro); font-weight: 600; letter-spacing: .025em;
  text-transform: uppercase; color: var(--faint);
}
.mono { font-family: var(--mono); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* ---------- shell -------------------------------------------------------- */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; height: 60px; flex: none;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.mark { width: 30px; height: 30px; flex: none; color: var(--ink); }
.wordmark { font-size: 15px; font-weight: 620; letter-spacing: -.01em; line-height: 1.15; }
.wordmark em { display: block; font: 400 12px/1.3 var(--sans); font-style: normal; color: var(--faint); letter-spacing: 0; }
.topbar .spring { flex: 1 1 auto; }

.pill {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px; font: 500 12px/1 var(--mono); color: var(--dim);
  white-space: nowrap;
}
.pill b { color: var(--ink); font-weight: 600; }
.led { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); flex: none; }
.led.on { background: var(--ink); box-shadow: 0 0 0 3px var(--line); }

.tabs { display: flex; gap: 4px; align-items: center; padding: 0 20px; height: 52px; flex: none;
        border-bottom: 1px solid var(--line); background: var(--surface); }
.tab {
  border: 1px solid transparent; background: none; color: var(--dim);
  padding: 7px 13px; border-radius: var(--r); font-size: 13.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 8px;
}
.tab:hover { color: var(--ink); background: var(--surface); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface-2); border-color: var(--line-2); }
.tab i { font: 600 12px/1 var(--mono); font-style: normal; color: var(--faint); }
.tab[aria-selected="true"] i { color: var(--ink); }
.tabs .spring { flex: 1 1 auto; }

/* The three answer shapes, stated where a viewer will see them. Same word, same
   weight, same place; only the dot differs. */
.key { display: flex; gap: 14px; align-items: center; font-size: var(--t-micro); color: var(--faint); }
.key span { display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; }
.key i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ink); }
.key i.k-none { background: none; border: 2px solid var(--ink); width: 7px; height: 7px; }
.key i.k-no { background: var(--ink); opacity: .35; box-shadow: 0 0 0 3px var(--line); }

main { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.02fr); min-height: 0; }

/* ---------- graph -------------------------------------------------------- */
.stage { position: relative; border-right: 1px solid var(--line); overflow: hidden;
         background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, var(--bg) 65%); }
#cy { position: absolute; inset: 0; }
.stage-foot {
  position: absolute; left: 16px; right: 16px; bottom: 16px;
  display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; pointer-events: none;
}
.legend {
  background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: var(--r);
  padding: 9px 11px; font-size: var(--t-micro); color: var(--faint); line-height: 1.75; max-width: 330px;
  box-shadow: var(--shadow);
}
.legend b { color: var(--dim); font-weight: 500; }
.legend i { font-style: normal; font-family: var(--mono); color: var(--ink); }
.hint {
  background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: var(--r);
  padding: 7px 11px; font-size: var(--t-micro); color: var(--faint); box-shadow: var(--shadow);
}

/* ---------- right pane --------------------------------------------------- */
.pane { display: flex; flex-direction: column; min-height: 0; }
.pane-head { padding: 16px 22px 14px; border-bottom: 1px solid var(--line); flex: none; }
.pane-head p { color: var(--dim); font-size: 13.5px; margin-top: 6px; max-width: 62ch; }
.pane-head b { color: var(--ink); font-weight: 600; }
.stream { flex: 1 1 auto; overflow-y: auto; padding: 16px 22px 28px; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .stream { scroll-behavior: auto; } }

.composer { flex: none; padding: 12px 22px 18px; border-top: 1px solid var(--line); background: var(--surface); }
.composer form { display: flex; gap: 8px; }
.field {
  flex: 1 1 auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r);
  padding: 11px 13px; font-size: var(--t-body);
}
.field::placeholder { color: var(--faint); }
.field:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn {
  border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r);
  padding: 10px 15px; font-size: 13.5px; font-weight: 500; white-space: nowrap; color: var(--ink);
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--faint); }
.btn:disabled { opacity: .45; cursor: default; }
/* One of the two places the system's only saturated colour is allowed. */
.btn.primary {
  background: var(--signal); color: #fff; border-color: transparent;
  font-weight: 500; letter-spacing: .3px; text-transform: uppercase; font-size: 12px;
}
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); border-color: transparent; }
.btn.danger { color: var(--ink); border-color: var(--line-2); background: none; }
.btn.danger:hover:not(:disabled) { background: var(--surface-2); }
.btn.ghost { background: none; color: var(--dim); border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line); }
.btn.small { padding: 6px 10px; font-size: 12.5px; }

/* ---------- ask-first empty state --------------------------------------- */
.start { max-width: 68ch; }
.start h2 { font-size: var(--t-title); font-weight: 600; letter-spacing: -.01em; margin-bottom: 6px; }
.start p { color: var(--dim); font-size: 13.5px; margin-bottom: 14px; }
.presets { display: grid; gap: 8px; }
.preset {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 11px 13px; display: grid; gap: 3px;
}
.preset:hover { background: var(--surface-2); border-color: var(--line-2); }
.preset strong { font-size: 14px; font-weight: 500; color: var(--ink); }
.preset span { font-size: var(--t-micro); color: var(--faint); }
.preset span em { font-style: normal; font-family: var(--mono); color: var(--dim); }

/* ---------- a turn ------------------------------------------------------- */
.turn { margin-bottom: 18px; }
.q { display: flex; gap: 9px; align-items: baseline; margin-bottom: 10px; }
.q .who { font: 600 12px/1.4 var(--mono); color: var(--faint); flex: none; }
.q .what { font-size: var(--t-lead); font-weight: 500; letter-spacing: -.005em; }

.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
/* The outcome, drawn rather than coloured. Filled = an answer. Hollow = a
   positive "nothing connects these". Faded = a refusal. Same word, same weight,
   same position -- so the eye reads three different kinds of statement without
   being told that a refusal is an error, which it is not. */
.badge {
  display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 0;
  font: 600 12px/1.4 var(--sans); letter-spacing: .025em; text-transform: uppercase;
  color: var(--ink); flex: none;
}
.badge::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ink);
}
.badge.none::before { background: none; border: 2px solid var(--ink); width: 7px; height: 7px; }
.badge.no::before { background: var(--ink); opacity: .35; box-shadow: 0 0 0 3px var(--line); }
.badge.err::before { background: var(--bad); }
.badge.plain { text-transform: none; letter-spacing: 0; font: 500 12.5px/1.4 var(--sans); }
.badge.plain::before { display: none; }
.tag {
  font: 500 12px/1 var(--sans); letter-spacing: .025em; text-transform: uppercase;
  color: var(--faint); flex: none;
}
.card-head .meaning { font-size: 12.5px; color: var(--faint); }
.card-body { padding: 14px; }
.answer { font-size: var(--t-lead); line-height: 1.62; }
.answer p { margin-bottom: 8px; }
.answer p:last-child { margin-bottom: 0; }
.answer ul { margin: 0 0 8px; padding-left: 20px; }
.answer li { margin-bottom: 3px; }
.answer li::marker { color: var(--faint); }
.answer strong { font-weight: 600; }
.answer code { font-family: var(--mono); font-size: 13.5px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chips .label { font-size: var(--t-micro); color: var(--faint); align-self: center; margin-right: 2px; }
.chip {
  font: 500 12px/1.5 var(--mono); color: var(--dim); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; cursor: pointer;
}
.chip:hover { color: var(--ink); border-color: var(--line-2); background: var(--surface-3); }
.chip.bad { color: var(--bad); border-color: #f0c2bd; background: #fdf6f5; }

.card-foot { border-top: 1px solid var(--line); }
.card-foot > summary {
  padding: 10px 14px; font-size: 12.5px; color: var(--dim); cursor: pointer;
  display: flex; align-items: center; gap: 8px; list-style: none;
}
.tstep > summary::-webkit-details-marker,
.card-foot > summary::-webkit-details-marker { display: none; }
.card-foot > summary::before { content: "▸"; color: var(--faint); font-size: 10px; transition: transform .15s; }
.card-foot > summary:hover { color: var(--ink); }
.card-foot[open] > summary::before { transform: rotate(90deg); }
.card-foot > summary:hover { color: var(--ink); }
.card-foot .body { padding: 0 14px 14px; display: grid; gap: 8px; }

/* Trace lines.
   The shape is shadcn/ui's Trace component: a line is an icon, a title, an
   optional description and a status, and it can expand into its detail (see
   ui.shadcn.com/docs/components/base/trace). This page has no React and no build
   step, so the composition is reproduced in about sixty lines of CSS rather than
   installed -- the pattern was what was worth taking, and its value here is that
   a refusal and a success are the same component with a different status, which
   is exactly the product's claim. */
.tstep { border-left: 2px solid var(--line-2); margin-left: 3px; }
.tstep[data-status="error"] { border-left-color: var(--faint); }
.tstep > summary {
  display: grid; grid-template-columns: 15px auto 1fr 12px; align-items: baseline;
  gap: 8px; padding: 5px 10px; cursor: pointer; list-style: none; border-radius: 0 6px 6px 0;
}
.tstep > summary:hover { background: var(--surface-2); }
.ticon { font-size: 11px; line-height: 1.5; text-align: center; }
.ticon.ok { color: var(--ink); }
.ticon.none { color: var(--faint); }
.ticon.error { color: var(--ink); opacity: .45; }
.ticon.pending { color: var(--faint); }
.ttitle { font: 600 12px/1.6 var(--mono); color: var(--ink); }
/* A refusal is not an error and is not coloured like one; it is quieter than an
   answer, and the word in the summary already says which it is. */
.ttitle.refused { color: var(--dim); }
.tdesc { font-size: 12px; color: var(--faint); text-align: right; }
.tchev { font-size: 9px; color: var(--faint); transition: transform .15s; }
.tstep[open] > summary > .tchev { transform: rotate(90deg); }
.tbody { padding: 2px 10px 10px 33px; display: grid; gap: 7px; }
.tsub { font-size: 12.5px; color: var(--dim); display: grid; grid-template-columns: 12px 1fr; gap: 7px; }
.tsub i { font-style: normal; color: var(--faint); text-align: center; }
.tsub.conflict { color: var(--ink); }
.tsub.missing { color: var(--faint); }
.tstep.running { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.flag { font-size: 13.5px; color: var(--ink); }
.flag.bad { color: var(--bad); }
.missing { font-size: 12.5px; color: var(--faint); }
pre {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px;
  overflow-x: auto; font-family: var(--mono); font-size: 12.5px; color: var(--dim); margin: 0;
}
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- the gate ---------------------------------------------------- */
/* The gate is the most consequential card on the page and it does not shout:
   a heavier hairline, no fill, and the payload sitting in plain sight. */
.gate { border-color: var(--faint); }
.gate .card-head { border-bottom-color: var(--faint); }
.gate h3 { font-size: 15px; font-weight: 600; }
.gate .hash { font: 500 12px/1.5 var(--mono); color: var(--ink); }
.gate .body { padding: 14px; }
.gate textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px; font: 400 12.5px/1.6 var(--mono); color: var(--dim); resize: vertical; margin-top: 10px;
}
.gate textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- transient states ------------------------------------------- */
.skel { display: grid; gap: 10px; }
.skel div { height: 13px; border-radius: 4px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2));
            background-size: 200% 100%; animation: sh 1.4s linear infinite; }
.skel div:nth-child(2) { width: 82%; }
.skel div:nth-child(3) { width: 61%; }
@keyframes sh { to { background-position: -200% 0; } }
.note { font-size: 12.5px; color: var(--faint); margin-top: 9px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; border: 1px solid var(--ink); border-radius: var(--r);
  padding: 9px 14px; font-size: 13px; box-shadow: var(--shadow); z-index: 20;
}

/* ---------- narrow ------------------------------------------------------ */
@media (max-width: 980px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 42vh minmax(0, 1fr); }
  .stage { border-right: 0; border-bottom: 1px solid var(--line); }
  .key { display: none; }
  .btn.primary { padding: 10px 14px; }
  .stage-foot { left: 12px; right: 12px; bottom: 12px; }
  .legend { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <svg class="mark" viewBox="0 0 128 128" fill="currentColor" aria-hidden="true"><circle cx='64.0' cy='20.0' r='7'/><circle cx='79.0' cy='22.7' r='7'/><circle cx='92.3' cy='30.3' r='7'/><circle cx='102.1' cy='42.0' r='7'/><circle cx='107.3' cy='56.4' r='7'/><circle cx='107.3' cy='71.6' r='7'/><circle cx='102.1' cy='86.0' r='7'/><circle cx='92.3' cy='97.7' r='7'/><circle cx='79.0' cy='105.3' r='7'/><circle cx='64.0' cy='108.0' r='7'/><circle cx='49.0' cy='105.3' r='7'/><circle cx='35.7' cy='97.7' r='7'/><circle cx='25.9' cy='86.0' r='7'/><circle cx='20.7' cy='71.6' r='7'/><circle cx='20.7' cy='56.4' r='7'/><circle cx='25.9' cy='42.0' r='7'/><circle cx='35.7' cy='30.3' r='7'/><circle cx='49.0' cy='22.7' r='7'/></svg>
    <div class="wordmark">Vouch<em>Who really owns this?</em></div>
    <div class="spring"></div>
    <div class="pill" id="engine" role="status"><span class="led"></span>connecting…</div>
  </header>

  <nav class="tabs" role="tablist" aria-label="What to demonstrate">
    <button class="tab" role="tab" data-track="01" aria-selected="true"><i>01</i>Act on connected data</button>
    <button class="tab" role="tab" data-track="02" aria-selected="false"><i>02</i>Memory and coordination</button>
    <button class="tab" role="tab" data-track="03" aria-selected="false"><i>03</i>Company brain</button>
    <div class="spring"></div>
    <div class="key" aria-label="The three answer shapes">
      <span><i class="k-yes"></i>answered</span>
      <span><i class="k-none"></i>no relation — a real answer</span>
      <span><i class="k-no"></i>refused</span>
    </div>
  </nav>

  <main>
    <section class="stage" aria-label="Graph">
      <div id="cy"></div>
      <div class="stage-foot">
        <div class="legend" id="legend"></div>
        <div class="hint">click a node to ask about it</div>
      </div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <div class="eyebrow">Track <span id="track-no">01</span></div>
        <p id="tagline"></p>
      </div>
      <div class="stream" id="stream" aria-live="polite" aria-busy="false"></div>
      <div class="composer">
        <form id="ask-form" autocomplete="off">
          <label class="sr" for="q">Ask a question</label>
          <input class="field" type="text" id="q" placeholder="Ask about impact, ownership or evidence…" spellcheck="false">
          <button class="btn primary" type="submit" id="ask-btn">Ask</button>
        </form>
        <div class="note">Enter to ask · Esc to clear · ⌘/Ctrl-K to focus</div>
      </div>
    </section>
  </main>
</div>

<script>
const TENANT = "acme";

/* Why the defaults on these presets are not the obvious ones:
   `blast_radius` is asked at depth 4, because at depth 1 the answer is the one a
   join could have produced and the whole claim is about what a join cannot see. */
const TRACKS = {
  "01": {
    tagline: "<b>Impact only the graph can see.</b> At one hop this looks like a table join. At four it finds a service nobody would page — and the action that follows waits for a human.",
    legend: "<i>CALLS</i> arrow points at the callee &middot; <i>OWNS</i> dashed, team → service &middot; node size is criticality",
    show: n => n.label === "Service" || ["CALLS","OWNS","TOUCHED","AFFECTS","RESOLVES","CAUSED"].includes(n.rel),
    presets: [
      ["What breaks if payments-api goes down?", "blast radius", "the depth-4 answer, with hops"],
      ["Who owns merchant-dashboard?", "ownership", "declared owner left in March; someone else is maintaining it"],
      ["Does anything depend on internal-status-page?", "no relation", "an answer, not a refusal"],
      ["Is anything known about the notification-service?", "refused", "the subject is not in the graph"],
    ],
  },
  "02": {
    tagline: "<b>A claim is invalidated, never deleted.</b> Ask the same question at two dates and get two different truths, each with the document that justified it.",
    legend: "<i>SUPPORTS</i> document → claim &middot; <i>CONTRADICTS</i> claim ⇄ claim &middot; <i>LEARNED_IN</i> claim → episode",
    show: n => ["Claim","Document","Decision","Episode","Service"].includes(n.label)
            || ["SUPPORTS","CONTRADICTS","LEARNED_IN","ABOUT","SUPERSEDES"].includes(n.rel),
    presets: [
      ["What did we believe about payments-api in March 2026?", "as-of", "the belief that was held then"],
      ["What do we believe about payments-api now?", "as-of", "the belief that replaced it"],
      ["Which claim was overturned, and by what?", "contradiction", "both sides, with dates"],
      ["What was learned from the July payment incident?", "episode", "memory as nodes, not a separate store"],
    ],
  },
  "03": {
    tagline: "<b>Decisions with their grounds.</b> Every decision cites the documents behind it — and one whose evidence was superseded says so instead of sounding settled.",
    legend: "<i>SUPPORTS</i> &middot; <i>SUPERSEDES</i> dotted &middot; <i>TOUCHED</i> person → service",
    show: () => true,
    presets: [
      ["What backs the decision to move to PSP v4?", "grounded", "two documents, one from an incident"],
      ["What is the evidence for dec-org-restructure?", "missing support", "the decision is real; its grounds are not"],
      ["Who has actually been working on payments-api?", "effective owner", "observed activity, not the org chart"],
      ["Who should be woken for inc-2026-07-11?", "routing", "the teams that own the affected services"],
    ],
  },
};

/* Categorical encoding for the graph, the way a chart has a categorical scale.
   These are not chrome colours and the chrome never borrows them; they are tuned
   to sit on Paper without glowing. */
const LABEL_COLOR = {
  Service:"#2f5fd0", Team:"#1f7a4d", Person:"#b4601a", Document:"#6b4fc9",
  Decision:"#a32ea0", Change:"#5a6472", Incident:"#b42318", Claim:"#0e7490",
  Episode:"#a16207", Procedure:"#6b7280", Handoff:"#c2410c", Action:"#4d7c0f",
};

const MEANING = {
  answered: "The graph answered this.",
  no_relation: "Nothing in the graph connects these. That is an answer, not a failure.",
  missing_subject: "The graph has no record of the subject, so there is nothing to reason from.",
  missing_support: "The graph cannot support an answer to this, so it refused rather than guess.",
  refused: "The graph could not support an answer. A confident guess here is the failure this tool exists to prevent.",
  engine_unavailable: "The graph is unreachable. This is an outage, not an absence — nothing was answered and nothing was guessed.",
};

let cy, allNodes = [], allEdges = [], track = "01";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------- graph -------------------------------------------------------- */
function renderGraph() {
  const spec = TRACKS[track];
  const nodes = allNodes.filter(n => spec.show({ label: n.label, rel: null }));
  const ids = new Set(nodes.map(n => n.id));
  const edges = allEdges.filter(e => ids.has(e.source) && ids.has(e.target) && spec.show({ label: null, rel: e.rel }));

  if (cy) cy.destroy();
  cy = cytoscape({
    container: $("cy"),
    elements: [
      ...nodes.map(n => ({ data: { id: n.id, label: n.key, kind: n.label, crit: n.criticality || 2 } })),
      ...edges.map((e, i) => ({ data: { id: "e" + i, source: e.source, target: e.target, rel: e.rel } })),
    ],
    minZoom: 0.25, maxZoom: 3,
    style: [
      { selector: "node", style: {
          "background-color": el => LABEL_COLOR[el.data("kind")] || "#888",
          "width": el => 11 + 3.2 * (el.data("crit") || 2),
          "height": el => 11 + 3.2 * (el.data("crit") || 2),
          label: "data(label)", "font-size": 10, "font-family": "ui-monospace, monospace",
          color: "#101828", "text-valign": "bottom", "text-margin-y": 5,
          "text-outline-color": "#ffffff", "text-outline-width": 3,
          "border-width": 0, "transition-property": "opacity", "transition-duration": "120ms",
      }},
      { selector: "edge", style: {
          width: 1, "line-color": "#d4d4d4", "target-arrow-color": "#d4d4d4",
          "target-arrow-shape": "triangle", "arrow-scale": .65, "curve-style": "bezier",
          "transition-property": "opacity", "transition-duration": "120ms",
      }},
      { selector: 'edge[rel = "OWNS"]', style: { "line-color":"#9a9a9a","target-arrow-color":"#9a9a9a","line-style":"dashed" }},
      { selector: 'edge[rel = "CONTRADICTS"]', style: { "line-color":"#b42318","target-arrow-color":"#b42318" }},
      { selector: 'edge[rel = "SUPPORTS"]', style: { "line-color":"#9a9a9a","target-arrow-color":"#9a9a9a" }},
      { selector: 'edge[rel = "SUPERSEDES"]', style: { "line-color":"#b8b8b8","target-arrow-color":"#b8b8b8","line-style":"dotted" }},
      { selector: "node:selected", style: { "border-width": 3, "border-color": "#101828" }},
      { selector: ".faded", style: { opacity: .12 }},
    ],
    /* Layered, not force-directed. CALLS is a DAG, so a layered layout shows hop
       distance as literal distance from the top -- which is the whole story of the
       depth-4 answer -- while `cose` on this many nodes produces a hairball whose
       labels collide. */
    layout: { name: "breadthfirst", directed: true, spacingFactor: 1.05,
              padding: 54, animate: false },
  });
  cy.on("tap", "node", ev => {
    const kind = ev.target.data("kind"), key = ev.target.data("label");
    if (kind === "Service") setQuestion(`Who owns ${key}?`);
    else if (kind === "Decision") setQuestion(`What is the evidence for ${key}?`);
    else if (kind === "Incident") setQuestion(`Who should be woken for ${key}?`);
    else setQuestion(`What is known about ${key}?`);
  });
  $("legend").innerHTML = spec.legend;
  window.__cy = cy;
}

function focusKeys(keys) {
  if (!cy || !keys.length) return;
  const wanted = new Set(keys);
  cy.nodes().forEach(n => {
    const match = wanted.has(n.data("label"));
    n.toggleClass("faded", !match);
    if (match) cy.elements().difference(n.closedNeighborhood()).addClass("faded");
  });
}

/* Status vocabulary, taken from Trace: "none" is finished work, "error" failed
   work, "running" is in progress, "pending" has not started. A tool that refused
   is not an error here -- it is a finished step that chose to stop -- so it gets
   its own icon and its own colour rather than the generic error treatment. */
const STATUS = {
  answered:        { icon: "✓", tone: "ok",    word: "answered" },
  no_relation:     { icon: "⊘", tone: "none",  word: "no relation" },
  missing_subject: { icon: "!", tone: "error", word: "refused — subject absent" },
  missing_support: { icon: "!", tone: "error", word: "refused — no support" },
  engine_unavailable: { icon: "!", tone: "error", word: "refused — graph unreachable" },
};

function stepHTML(t, open) {
  const s = STATUS[t.outcome] || STATUS.missing_support;
  const refused = s.tone === "error";
  const bits = [];
  if (t.facts.length) bits.push(`${t.facts.length} fact${t.facts.length === 1 ? "" : "s"}`);
  if (t.evidence.length) bits.push(`${t.evidence.length} opened`);
  if (t.conflicts.length) bits.push(`${t.conflicts.length} conflict${t.conflicts.length === 1 ? "" : "s"}`);
  const cands = t.candidates || [];
  if (t.paths.length) bits.push(`${t.paths.length} path${t.paths.length === 1 ? "" : "s"}`);
  if (cands.length) bits.push(`${cands.length} known`);
  const inner = [
    ...t.facts.map(f => `<div class="tsub"><i>·</i><span>${esc(f)}</span></div>`),
    ...t.conflicts.map(c => `<div class="tsub conflict"><i>!</i><span>${esc(c)}</span></div>`),
    ...t.missing_information.map(m => `<div class="tsub missing"><i>?</i><span>${esc(m)}</span></div>`),
    ...t.paths.map(p => `<div class="tsub"><i>↳</i><span class="mono">${esc(p)}</span></div>`),
    ...(cands.length
      ? [`<div class="tsub missing"><i>+</i><span class="mono">${cands.map(esc).join(" · ")}</span></div>`]
      : []),
    ...(t.evidence.length
      ? [`<div class="tsub"><i>§</i><span class="mono">${t.evidence.map(esc).join("<br>")}</span></div>`]
      : []),
  ].join("");
  return `<details class="tstep" data-status="${refused ? "error" : "ok"}"${open ? " open" : ""}>
    <summary>
      <span class="ticon ${s.tone}">${s.icon}</span>
      <span class="ttitle${refused ? " refused" : ""}">${esc(t.tool || "tool")}</span>
      <span class="tdesc">${bits.join(" · ") || s.word}</span>
      <span class="tchev">▸</span>
    </summary>
    <div class="tbody">${inner || `<div class="tsub missing"><i>·</i><span>Nothing was read.</span></div>`}</div>
  </details>`;
}

/* Shown while the model is choosing. The line already looks like the one that will
   replace it, so the reader learns the shape of a trace before seeing one. */
function runningSteps() {
  return `<details class="tstep running" data-status="ok" open>
    <summary><span class="ticon pending">◐</span><span class="ttitle">reading the graph</span>
    <span class="tdesc">running</span><span class="tchev">▸</span></summary>
    <div class="tbody"><div class="tsub missing"><i>·</i><span>The model chooses a tool; the backend owns the query.</span></div></div>
  </details>`;
}

/* ---------- the stream --------------------------------------------------- */
function emptyState() {
  return `<div class="start" id="start">
    <h2>Ask the graph.</h2>
    <p>Every answer is either backed by evidence this agent read, a positive statement that
    nothing connects these, or a refusal. It will not fill a gap with a plausible sentence.</p>
    <div class="presets" id="presets"></div>
  </div>`;
}

function presetButtons() {
  return TRACKS[track].presets.map(([q, kind, why]) =>
    `<button class="preset" type="button" data-q="${esc(q)}">
       <strong>${esc(q)}</strong>
       <span><em>${esc(kind)}</em> — ${esc(why)}</span>
     </button>`).join("");
}

function wirePresets() {
  document.querySelectorAll("#presets .preset").forEach(b => {
    b.onclick = () => setQuestion(b.dataset.q, true);
  });
}

function skeleton(question) {
  return `<div class="turn">
    <div class="q"><span class="who">you</span><span class="what">${esc(question)}</span></div>
    <div class="card"><div class="card-head">
      <span class="badge plain" style="color:var(--faint)">◐ running</span>
      <span class="meaning">the model is choosing a tool</span>
    </div>
    <div class="card-body"><div class="skel"><div></div><div></div><div></div></div></div>
    <div class="card-foot" style="padding:8px 14px">${runningSteps()}</div></div>
  </div>`;
}

function turnHTML(question, d) {
  const refused = d.refused;
  const kind = refused ? "no" : (d.outcome === "answered" ? "yes" : d.outcome === "no_relation" ? "none" : "no");
  const label = refused ? "refused" : d.outcome.replace(/_/g, " ");
  const meaning = MEANING[d.outcome] || "";
  const cites = (d.citations || []).map(c => `<span class="chip" data-key="${esc(c)}">${esc(c)}</span>`).join("");
  const viol = (d.violations || []).map(v => `<span class="chip bad" title="${esc(v.detail)}">✕ ${esc(v.kind)}</span>`).join("");

  const steps = (d.trace || []).map((t, i) => stepHTML(t, (d.trace || []).length === 1 || i === 0)).join("");
  const top = (d.trace || []).map(t => t.tool).filter(Boolean);
  return `<div class="turn">
    <div class="q"><span class="who">you</span><span class="what">${esc(question)}</span></div>
    <div class="card">
      <div class="card-head">
        <span class="badge ${kind}">${esc(label)}</span>
        <span class="meaning">${esc(meaning)}</span>
        <span style="flex:1"></span>
        <button class="btn ghost small" type="button" data-copy>copy</button>
      </div>
      <div class="card-body">
        <div class="answer" data-answer>${renderAnswer(d.answer)}</div>
        ${cites || viol ? `<div class="chips">${cites ? `<span class="label">cited</span>${cites}` : ""}${viol}</div>` : ""}
      </div>
      <details class="card-foot">
        <summary>what the agent read — ${esc(top.join(" → ") || "no tool")}</summary>
        <div class="body">${steps || `<div class="tsub missing"><i>·</i><span>No tool ran.</span></div>`}</div>
      </details>
    </div>
  </div>`;
}

/* The model answers in light markdown, so the renderer handles exactly that much
   and no more: bold, inline code, bullets, and paragraph breaks. Keys in prose are
   wrapped in <code> so the citation is visible in the sentence, not only in a list
   underneath it -- the guard has already decided which keys are grounded. */
const HYPHEN_PREFIXES = /^(well|high|long|real|open|closed|single|multi|end|non|pre|post|up|down|self|read|write|time|life|top|low|short)-/;
function renderAnswer(text) {
  const key = k => HYPHEN_PREFIXES.test(k) ? k : `<code>${k}</code>`;
  return esc(text).split(/\n{2,}/).map(para => {
    const lines = para.split("\n").filter(l => l.trim());
    const bullet = l => l.match(/^\s*[*\u2022-]\s+(.*)$/);
    if (lines.length && lines.every(l => bullet(l))) {
      return `<ul>${lines.map(l => `<li>${inline(bullet(l)[1])}</li>`).join("")}</ul>`;
    }
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");

  function inline(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\b([a-z][a-z0-9]*(?:-[a-z0-9]+)+)\b/g, (m, k) => key(k));
  }
}

/* ---------- the gate ----------------------------------------------------- */
async function renderGate(host) {
  const { approvals } = await (await fetch(`/api/approvals?tenant=${TENANT}`)).json();
  const open = approvals.filter(a => a.status === "pending" || a.status === "approved");
  const settled = approvals.filter(a => !["pending", "approved"].includes(a.status));
  const wrap = document.createElement("div");
  wrap.className = "turn";

  if (!open.length) {
    wrap.innerHTML = `<div class="card gate">
      <div class="card-head"><span class="tag">approval gate</span>
        <h3>${settled.length ? "Nothing pending" : "No action filed yet"}</h3></div>
      <div class="body">
        <div class="note">${settled.length
          ? `Last decision: <b>${esc(settled[0].status)}</b> by ${esc(settled[0].decided_by || "—")}. The agent can file an action and cannot carry one out.`
          : "Ask an impact question, then file the fix. A named human has to approve the exact payload — edit one character and the approval is void."}</div>
        <div class="row">
          <button class="btn small" type="button" data-file="merchant-dashboard">File a review for merchant-dashboard</button>
          <button class="btn small ghost" type="button" data-file="payments-api">File one for payments-api</button>
        </div>
      </div></div>`;
  } else {
    const a = open[0];
    wrap.innerHTML = `<div class="card gate">
      <div class="card-head">
        <span class="tag">approval gate</span>
        <h3>${esc(a.action)} on ${esc(a.service)}</h3>
      </div>
      <div class="body">
        <div class="hash">payload ${esc(a.payload_hash.slice(0, 20))}… · status ${esc(a.status)}</div>
        <div class="note">Bound to the exact payload below. It cannot run until a named human approves, and it cannot run at all if the payload changes after that.</div>
        <label class="sr" for="payload">payload</label>
        <textarea id="payload" rows="10" spellcheck="false">${esc(JSON.stringify(a.payload, null, 2))}</textarea>
        <div class="row">
          ${a.status === "pending" ? `
            <button class="btn primary small" type="button" data-decide="${a.id}" data-approve="1">Approve</button>
            <button class="btn danger small" type="button" data-decide="${a.id}" data-approve="0">Reject</button>` : ""}
          ${a.status === "approved" ? `
            <button class="btn primary small" type="button" data-run="${a.id}" data-tamper="0">Execute this payload</button>
            <button class="btn danger small" type="button" data-run="${a.id}" data-tamper="1">Change one character, then execute</button>` : ""}
        </div>
        <div class="note" id="gate-note"></div>
      </div></div>`;
  }
  host.appendChild(wrap);
  wireGate(wrap);
}

function wireGate(scope) {
  scope.querySelectorAll("[data-file]").forEach(b => b.onclick = () => fileAction(b.dataset.file));
  scope.querySelectorAll("[data-decide]").forEach(b => b.onclick = () => decide(b.dataset.decide, b.dataset.approve === "1"));
  scope.querySelectorAll("[data-run]").forEach(b => b.onclick = () => run(b.dataset.run, b.dataset.tamper === "1"));
}

async function fileAction(service) {
  const panel = $("stream");
  panel.insertAdjacentHTML("beforeend", skeleton(`File an ownership review for ${service}`));
  scrollEnd();
  const r = await fetch("/api/actions", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({
      action: "flag_for_review", service, tenant: TENANT,
      title: `Ownership review: ${service}`,
      body: `The owner recorded for ${service} is not current, so no one is accountable for it.`,
      decision: "dec-psp-v4",
    }),
  });
  const d = await r.json();
  panel.lastElementChild.outerHTML = turnHTML(`File an ownership review for ${service}`, d);
  refreshGate();
}

async function decide(id, approve) {
  await fetch(`/api/approvals/${id}/decide`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ approve, decided_by: "ops-lead", note: approve ? "reviewed" : "not now" }),
  });
  refreshGate();
  toast(approve ? "Approved. The payload is now frozen against its hash." : "Rejected. Nothing will run.");
}

async function run(id, tamper) {
  let payload;
  try { payload = JSON.parse($("payload").value); } catch { payload = {}; }
  if (tamper && typeof payload.title === "string") {
    payload.title = payload.title.slice(0, -1) + (payload.title.endsWith("x") ? "y" : "x");
  }
  const r = await fetch(`/api/approvals/${id}/execute`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ payload }),
  });
  const d = await r.json();
  const note = $("gate-note");
  if (!note) return;
  const steps = d.trace || [];
  note.innerHTML = `<div style="margin-top:12px">
    <span class="badge ${d.refused ? "no" : "yes"}">${esc(d.outcome.replace(/_/g, " "))}</span>
    ${steps.flatMap(t => t.facts).map(f => `<div style="margin-top:8px">${esc(f)}</div>`).join("")}
    ${steps.flatMap(t => t.conflicts).map(c => `<div class="flag" style="margin-top:8px">⚠ ${esc(c)}</div>`).join("")}
    ${steps.flatMap(t => t.missing_information).map(m => `<div class="missing" style="margin-top:8px">${esc(m)}</div>`).join("")}
  </div>`;
  toast(d.refused
    ? "The approval was void — the payload no longer matches what was approved."
    : "Executed against the approved payload.");
  refreshGate();
}

async function refreshGate() {
  const old = $("stream").querySelector(".gate")?.closest(".turn");
  const host = document.createElement("div");
  await renderGate(host);
  const fresh = host.firstElementChild;
  if (old) old.replaceWith(fresh); else $("stream").appendChild(fresh);
  scrollEnd();
}

/* ---------- ask ---------------------------------------------------------- */
async function ask(question) {
  const panel = $("stream");
  $("start")?.remove();
  panel.insertAdjacentHTML("beforeend", skeleton(question));
  panel.setAttribute("aria-busy", "true");
  $("ask-btn").disabled = true;
  scrollEnd();
  try {
    const r = await fetch("/api/ask", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ question, tenant: TENANT }),
    });
    const d = await r.json();
    // The API tells us *why* it refused, including when the reason is that the
    // engine is gone. Reading the status code instead would collapse an outage
    // into the same red card as an absence, which is the confusion this whole
    // product is about.
    panel.lastElementChild.outerHTML = turnHTML(question, r.ok ? d : {
      outcome: d.outcome || "missing_support", refused: true, citations: [], violations: [],
      answer: d.detail || r.statusText, trace: [],
    });
    if (track === "01") refreshGate();
  } catch (e) {
    panel.lastElementChild.outerHTML = turnHTML(question, {
      outcome: "missing_support", refused: true, citations: [], violations: [],
      answer: `Could not reach the API: ${e.message}`, trace: [],
    });
  } finally {
    panel.setAttribute("aria-busy", "false");
    $("ask-btn").disabled = false;
    wireChips(panel);
    scrollEnd();
  }
}

function wireChips(scope) {
  scope.querySelectorAll("[data-key]").forEach(c => c.onclick = () => focusKeys([c.dataset.key]));
  scope.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const text = b.closest(".card").querySelector("[data-answer]").innerText;
    try { await navigator.clipboard.writeText(text); toast("Answer copied."); } catch { toast("Clipboard unavailable."); }
  });
}

function scrollEnd() { const s = $("stream"); s.scrollTop = s.scrollHeight; }
function setQuestion(q, submit = false) { $("q").value = q; if (submit) ask(q); else $("q").focus(); }

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

/* ---------- chrome ------------------------------------------------------- */
function setTrack(t) {
  track = t;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.track === t)));
  $("track-no").textContent = t;
  $("tagline").innerHTML = TRACKS[t].tagline;
  $("stream").innerHTML = emptyState();
  $("presets").innerHTML = presetButtons();
  wirePresets();
  renderGraph();
  if (t === "01") refreshGate();
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTrack(b.dataset.track));
$("ask-form").onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); if (q) ask(q); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("q").value = ""; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("q").focus(); $("q").select(); }
});

(async function boot() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("engine").innerHTML = `<span class="led ${h.healthy ? "on" : ""}"></span>FalkorDB <b>${esc(h.engine_version)}</b> · ${esc(h.module)} · actions: ${esc(h.adapter)}`;
  } catch {
    $("engine").innerHTML = `<span class="led"></span>engine unreachable`;
  }
  try {
    const g = await (await fetch(`/api/graph?tenant=${TENANT}`)).json();
    allNodes = g.nodes; allEdges = g.edges;
  } catch { allNodes = []; allEdges = []; }
  setTrack("01");
  setQuestion(TRACKS["01"].presets[0][0]);
})();
</script>
</body>
</html>
