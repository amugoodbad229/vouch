# Vouch — local FalkorDB.
#
#   docker compose up -d --wait      # engine + Browser UI, blocks until healthy
#   docker compose logs -f           # engine logs
#   docker compose down              # stop, KEEP the data volume
#   docker compose down -v           # stop, WIPE the data volume
#
# Browser UI: http://localhost:3000
#
# A second engine, for cross-release checks, without a second service definition:
#
#   FALKORDB_TAG=6.0.1 FALKORDB_PORT=6380 FALKORDB_BROWSER_PORT=3001 \
#     docker compose -p vouch-alt up -d --wait

name: vouch

services:
  falkordb:
    # PINNED ON PURPOSE. Do not change this to `latest` or to a floating major.
    # The same graph on two releases returned different PageRank scores and
    # different no-path shapes in this project's own probes, so `latest` would
    # silently change what an answer means. Overridable only to pin a different
    # *specific* release for a comparison run.
    image: falkordb/falkordb:${FALKORDB_TAG:-v4.22.0}
    restart: unless-stopped

    # No `container_name` and no named volume, on purpose: Compose derives both
    # from the project name, so the comparison run above gets its own container
    # AND its own volume. Hard-coding either would have a second engine
    # appending to the first engine's AOF file.
    # Inspect with: docker compose exec falkordb redis-cli

    # Bound to loopback. This instance runs with no password, so publishing on
    # 0.0.0.0 would expose an unauthenticated graph to the local network.
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"          # RESP, used by the Python client
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3000}:3000"  # FalkorDB Browser, same container

    environment:
      # run.sh appends this to `redis-server` as *module* arguments.
      FALKORDB_ARGS: >-
        MAX_QUEUED_QUERIES 25
        TIMEOUT 1000
        RESULTSET_SIZE 10000
      # run.sh appends this to `redis-server` as *Redis* arguments.
      # AOF so a seeded graph survives a restart; `noeviction` so the host cannot
      # evict graph keys out from under an in-flight traversal.
      REDIS_ARGS: >-
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy noeviction
      # FalkorDB Browser (port 3000 above). Set to 0 to run the engine alone.
      BROWSER: "1"

    volumes:
      # /data is a symlink to /var/lib/falkordb/data, which is what run.sh passes
      # to `redis-server --dir`. Mounting /data persists the right place.
      - falkordb-data:/data

    healthcheck:
      # PONG means the module loaded and is serving, not merely that 6379 is open.
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  falkordb-data:
